<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- GitHub social preview: 1280x640, generated by `mise run social`.
       The logo is referenced rather than duplicated, so the two cannot drift.
       This file is only ever rasterized locally, never served, so the nested
       SVG reference is safe here in a way it would not be in a served asset.
       The background is opaque because transparency renders black on most
       social cards.

       It embeds logo.svg, not logo.src.svg: the source still carries live
       <text>, so rendering it here would put the preview back at the mercy of
       the fonts on this machine. Run `mise run logo` first.

       The <image> box keeps logo.svg's own 4134:1281 ratio, so the wordmark is
       not distorted. Re-measure it whenever logo.src.svg changes: 900 / 3.2272
       is where the 278.86 comes from.

       The tagline is a <text> element: this is rasterized on one machine and
       uploaded by hand, so a missing font is visible to the person running the
       task rather than silently shipped. The fallback chain ends in a family
       every platform has. It must stay in step with Cargo.toml's `description`.
       -->
  <rect width="1280" height="640" fill="#FFFFFF"/>
  <image href="logo.svg" x="190" y="140" width="900" height="278.86"/>
  <text x="640" y="490" text-anchor="middle"
        font-family="Fira Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" fill="#ED4925">Git-native project templates</text>
</svg>
