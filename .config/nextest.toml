# nextest configuration.

[profile.default]
# Integration tests create real Git repositories on disk. A slow leg is normal
# on a cold cache; a hung one is not.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# CI wants the full picture from one run, not the first failure.
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
