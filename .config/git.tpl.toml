# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"
ref = "main"

[answers]
archive = true
aur = true
aur_package_name = "git-tpl-bin"
author = "Axel H. <noirbizarre@gmail.com>"
bin_name = "git-tpl"
categories = "command-line-utilities,development-tools"
copyright_holder = "Axel H."
copyright_year = 2026
crate = "git-tpl"
description = "Git-native project templates"
docs = true
docs_accent = "deep orange"
homebrew = true
homebrew_tap = "noirbizarre/homebrew-tap"
keywords = "git,template,scaffolding,minijinja,project"
kind = "library-and-binary"
man_pages = false
mbx = true
msrv = true
msrv_version = "1.96"
owner = "noirbizarre"
publish = true
rolling_prerelease = false
service = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
