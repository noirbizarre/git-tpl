# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is
# committed. CI installs from these two files, so local runs and CI runs
# use identical tool versions — CI drives the tools directly rather than
# through the tasks defined below.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only. It matters
# here: cargo-binstall has no prebuilt artifact for resvg, usvg or cargo-insta,
# so a global entry would make every CI job compile all three from source.
#
# Rustup still owns toolchains. Mise's native MBX integration wraps Cargo,
# while the environment below preserves explicit and CI-selected toolchains.

[settings]
# Resolve tools through mise.lock and keep it updated. Without this, the
# lockfile is ignored and `latest` really means latest.
lockfile = true

# Avoid a second install request from the version file: runtime selection
# below preserves the toolchain and extra components installed by CI.
idiomatic_version_file_enable_tools = []

[tools]
# MBX 1.28 has no Intel macOS binary; keep rustup-only Cargo there.
rust = [
  { version = "stable", components = ["rustfmt", "clippy"], mr_boxington = true, os = ["linux", "macos/arm64", "windows"] },
  { version = "stable", components = ["rustfmt", "clippy"], os = ["macos/x64"] },
]
mr-boxington = { version = "1.28.0", os = ["linux", "macos/arm64", "windows"] }
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is
# absent, so without this a local run is NOT the CI run. Runners ship it.
# The implicit asdf backend has no download URLs for locked installations.
"aqua:koalaman/shellcheck" = "latest"
prek = "latest"
typos = "latest"
uv = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# Use a release to maintain the template even before this checkout builds.
# The cargo backend uses binstall metadata and supports locked installation.
"cargo:git-tpl" = "0.14.3"
# cargo-insta, usvg and resvg are declared on the tasks that use them instead
# of here — see the note in the header.

[env]
# dtolnay selects a rustup default, not RUSTUP_TOOLCHAIN. Preserve that
# selection in Actions (especially MSRV) and explicit overrides everywhere.
RUSTUP_TOOLCHAIN = """
{%- if env.RUSTUP_TOOLCHAIN | default(value='', boolean=true) -%}
{{ env.RUSTUP_TOOLCHAIN }}
{%- elif env.GITHUB_ACTIONS | default(value='') == 'true' -%}
{{ exec(command='rustup default') | trim | split(pat=' ') | first }}
{%- else -%}
stable
{%- endif -%}
"""
# Do not collect existing caches or relocate the project's target outputs.
MBX_GC_AUTO = "0"
MBX_TARGET_VIEWS = "0"

# --- Everyday ---------------------------------------------------------------

[tasks.default]
description = "Run format, lint, build and test"
depends = ["format", "lint", "lint:actions", "lint:md", "build", "test"]

[tasks.build]
description = "Build the binary"
run = "cargo build"

[tasks.test]
description = "Run tests (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check the formatting without rewriting"
run = "cargo fmt --all -- --check"

# Keep the old explicit task invocations working; `mise fmt` is a builtin.
[tasks.fmt]
description = "Alias for format (use mise run fmt)"
depends = ["format"]

[tasks."fmt:check"]
description = "Alias for format:check"
depends = ["format:check"]

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Suppressions live in .github/actionlint.yml rather than as flags here, so
# this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:md"]
description = "Lint the documentation Markdown"
# Both packages must share an npm environment so the formatter can resolve.
run = 'npx -y -p markdownlint-cli2 -p markdownlint-cli2-formatter-pretty -- markdownlint-cli2 "AGENTS.md" "CONTRIBUTING.md" "README.md" "docs/**/*.md" "skills/**/*.md"'

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

[tasks.check]
description = "Run every check that does not modify the working tree"
depends = ["format:check", "lint", "lint:actions", "lint:md", "spell", "test"]

[tasks.ci]
description = "Everything CI runs, locally"
depends = ["check", "docs:build"]

# --- git-tpl itself ---------------------------------------------------------

[tasks.cli]
description = "Run git-tpl from source"
raw_args = true
run = "cargo run --bin git-tpl --"

# Retain raw argument forwarding for existing developer scripts.
[tasks.tpl]
description = "Run git-tpl from source (alias for cli)"
raw_args = true
run = "cargo run --bin git-tpl --"

[tasks.setup]
description = "Install git-tpl locally, so `git tpl` resolves to this build"
run = "cargo install --path . --force"

# --- Documentation ----------------------------------------------------------

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
run = "uvx zensical build"

# --- Release ----------------------------------------------------------------

[tasks.changelog]
description = "Preview the changelog for the unreleased commits"
run = "git cliff --unreleased"

[tasks.release]
description = "Show the version the next release would take"
# The release itself is driven by gh-ship from .github/workflows/ship.yaml.
# This task exists to answer 'what would ship next?' without opening CI.
run = "git cliff --bumped-version"

[tasks."ship:validate"]
description = "Validate the gh-ship release contract"
run = "gh ship validate"

# --- Template ---------------------------------------------------------------
# Update advances the rendered ref, not HEAD or the index. Newly answered
# questions can also be recorded in .config/git.tpl.toml, unstaged.
[tasks."tpl:update"]
description = "Update the rendered template ref"
depends = ["tpl:baseline"]
raw_args = true
run = "git tpl update --defaults"

[tasks."tpl:diff"]
description = "Preview merging the rendered template"
raw_args = true
run = "git tpl diff"

[tasks."tpl:check"]
description = "Update the template ref and fail if its merge would change files"
depends = ["tpl:baseline"]
# Update before diff so this checks upstream rather than a stale local ref.
run = """
#!/usr/bin/env bash
set -euo pipefail
git tpl update --defaults
git tpl diff --exit-code --stat
"""

[tasks."tpl:baseline"]
description = "Restore a missing template ref from merged render history"
# Fresh clones have the rendered commits through merge ancestry, but no
# refs/tpl/*. An orphan re-render would lose the base and report false drift.
# Only create an absent ref; never rewind an existing append-only history.
run = """
#!/usr/bin/env bash
set -euo pipefail
ref=refs/tpl/github-com-noirbizarre-rust-tpl
if ! git show-ref --verify --quiet "$ref"; then
  baseline=$(git log HEAD --topo-order -1 --format=%H \
    --grep='^Template-Source: https://github.com/noirbizarre/rust.tpl$')
  if [ -z "$baseline" ]; then
    echo 'No merged template rendering found; fetch the full project history first.' >&2
    exit 1
  fi
  git update-ref "$ref" "$baseline" 0000000000000000000000000000000000000000
fi
"""

# --- Artwork ----------------------------------------------------------------
#
# Neither of these joins `default`: they rewrite committed files, so a routine
# run would dirty the working tree every time. Run them when the artwork
# changes, in order: `logo` re-flattens the wordmark, then `social` re-renders
# the preview that embeds it.

[tasks.logo]
description = "Flatten the wordmark source into docs/images/logo.svg"
# logo.svg is committed as paths only, never as live <text>: it is served to
# every README reader from raw.githubusercontent.com, and a <text> wordmark
# would be re-set in whatever font the reader happens to have. usvg converts
# text to paths by default, which is exactly the flattening step, so the
# editable source stays logo.src.svg and the outlined result is generated.
#
# Requires Fira Sans on the machine running it — a missing font silently
# substitutes another, so check the diff before committing.
#
# Declared on the task rather than in `[tools]` for the same reason as resvg —
# see the note in the header.
tools = { "cargo:usvg" = "latest" }
run = """
#!/usr/bin/env bash
set -euo pipefail

# logo.src.svg copies icon.svg's paths rather than referencing the file, because
# usvg embeds a referenced SVG as a base64 data URI instead of inlining it, and
# GitHub sanitizes the SVGs it serves — the README would risk a blank box. A
# copy can drift, so it is checked here: every path of the mark must still be
# present, byte for byte, in the wordmark source.
drift=$(comm -23 \\
  <(grep -o 'd="[^"]*"' docs/images/icon.svg | sort) \\
  <(grep -o 'd="[^"]*"' docs/images/logo.src.svg | sort))
test -z "$drift" || {
  echo "logo.src.svg's mark has drifted from icon.svg — re-copy the paths" >&2
  exit 1
}

usvg docs/images/logo.src.svg docs/images/logo.svg
grep -q '<text' docs/images/logo.svg && { echo "logo.svg still carries live text" >&2; exit 1; }

# usvg resolves the viewBox into a transform and emits width/height only. That
# renders fine on its own but does not scale: social-preview.svg embeds the logo
# through <image width height>, which needs an intrinsic aspect ratio to fit
# into. Putting the viewBox back is what keeps the embedded logo from being
# drawn at 1:1 and clipped.
read -r w h < <(sed -n 's/.*width="\\([0-9.]*\\)" height="\\([0-9.]*\\)".*/\\1 \\2/p' docs/images/logo.svg | head -n 1)
test -n "$w" && test -n "$h"
sed -i "0,/<svg /s|<svg |<svg viewBox=\\"0 0 $w $h\\" |" docs/images/logo.svg
grep -q 'viewBox=' docs/images/logo.svg

echo "docs/images/logo.svg — ${w}x${h}; re-run 'mise run social' to refresh the preview"
"""

[tasks.social]
description = "Render the GitHub social preview image"
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under:
#   Settings -> General -> Social preview
#
# The canvas lives in social-preview.svg rather than being passed as flags:
# resvg scales to fit rather than padding, so --width 1280 --height 640 on a
# non-2:1 source yields the wrong size, not GitHub's required 1280x640. The
# wrapper references logo.svg instead of copying it, so the two cannot drift —
# but it does read what `mise run logo` produces, so run that first.
tools = { "cargo:resvg" = "latest" }
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
