# Zensical configuration.
# https://zensical.org/docs/setup/

[project]

site_name = "git-tpl"
site_description = "Git-native project templates — a template update is just a new Git state you merge."
site_url = "https://noirbizarre.github.io/git-tpl/"
site_author = "noirbizarre"

repo_url = "https://github.com/noirbizarre/git-tpl"
repo_name = "noirbizarre/git-tpl"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Axel H. — MIT licensed
"""

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    { "The Git model" = "concepts/git-model.md" },
    { "Determinism" = "concepts/determinism.md" },
  ] },
  { "Usage" = [
    { "init" = "usage/init.md" },
    { "update" = "usage/update.md" },
    { "render" = "usage/render.md" },
    { "lint" = "usage/lint.md" },
    { "Answers from a file" = "usage/answers.md" },
    { "status" = "usage/status.md" },
    { "diff" = "usage/diff.md" },
    { "show" = "usage/show.md" },
    { "merge" = "usage/merge.md" },
    { "fetch" = "usage/fetch.md" },
    { "push" = "usage/push.md" },
  ] },
  { "Templates" = [
    { "Format" = "templates/format.md" },
    { "Questions" = "templates/questions.md" },
    { "Computed values" = "templates/computed.md" },
    { "Template context" = "templates/context.md" },
    { "Local development" = "templates/local-development.md" },
  ] },
  { "Data sources" = [
    { "Overview" = "data/index.md" },
    { "Local data" = "data/local.md" },
    { "Remote data" = "data/remote.md" },
    { "Reproducibility" = "data/reproducibility.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "Reference" = [
    { "Diagnostic codes" = "reference/diagnostics.md" },
    { "JSON output" = "reference/json.md" },
  ] },
  { "Development" = [
    { "Setup" = "development/setup.md" },
    { "Contributing" = "development/contributing.md" },
    { "Releasing" = "development/releasing.md" },
  ] },
  { "About" = [
    { "Architecture Decisions" = "adr/README.md" },
  ] },
]

[project.theme]

language = "en"

# The header slot is one line tall and already sits next to the site name, so
# it gets the mark alone — a wordmark would render as an illegible sliver and
# repeat the name.
logo = "images/icon.svg"
favicon = "images/icon.svg"

features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Three entries, in this order. The first has no `scheme`, so it follows the
# operating system — and being first, it is what a visitor gets by default. The
# other two let anyone override that choice, which then persists.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/monitor"
toggle.name = "Following your system — switch to light"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to following your system"

# Markdown extensions used by the documentation. Admonitions and tabs carry
# most of the guidance; superfences is required for fenced code blocks with
# annotations.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
