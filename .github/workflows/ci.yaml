name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub defaults Windows steps to pwsh, which neither stops at the first
# failing command nor reports anything but the last one's exit status — a
# multi-command step there fails silently and the job goes green. bash is
# present on all three runners and is invoked with `-e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Shared caches cannot reuse Cargo's private incremental state.
  CARGO_INCREMENTAL: "0"
  # Windows ships lld-link; nextest links one executable per test target.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The channel comes from the action ref, not rust-toolchain.toml,
      # and each job installs the components it needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1

      # Tool versions come from mise.toml + mise.lock, so CI runs exactly
      # what `mise run default` runs locally.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      # Includes Cargo downloads and outputs; do not duplicate rust-cache.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: lint-v1
          save-on-pull-request: true

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

      # Keep Clippy enforcement after removing its expensive commit hook.
      - name: Lint Rust
        run: mise run lint

      # Validate the release contract alongside the other configuration checks.
      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the release setup
        run: gh ship validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            flag: linux
          - name: Windows
            runner: windows-latest
            flag: windows
          - name: macOS
            runner: macos-latest
            flag: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install mold (faster Linux linker)
        if: matrix.os.flag == 'linux'
        uses: rui314/setup-mold@v1

      # nextest and llvm-cov are pinned by mise.lock rather than resolved
      # per-run, so a tool release cannot change CI behaviour on its own.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: tests-${{ matrix.os.flag }}-v1
          save-on-pull-request: true

      # The integration tests create real Git repositories and commit to them.
      # libgit2 refuses to build a signature without a configured identity, so
      # without this every one of them fails on a fresh runner.
      - name: Configure a Git identity for the integration tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Disable Windows Defender real-time scanning
        if: matrix.os.flag == 'windows'
        shell: pwsh
        # This suite spawns thousands of short-lived `git`/`git-tpl` processes and
        # writes just as many small files into fresh temp directories per test.
        # Defender's real-time protection inspects both, and that inspection is
        # the standard, documented reason this workload is dramatically slower on
        # `windows-latest` than on Linux/macOS — matching the "~4x slower" this
        # project already lives with per `.github/codecov.yml`. The runner is
        # destroyed at the end of the job, so there is nothing to re-enable.
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Flagging each leg keeps the three reports distinguishable, so a
          # partial upload is visible rather than looking like a coverage drop.
          flags: ${{ matrix.os.flag }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  # `rust-version` in Cargo.toml is a promise. Without a job that keeps it,
  # it drifts the first time anyone uses a newer language feature.
  msrv:
    name: 🧓 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: rui314/setup-mold@v1
      # No mise activation here: invoke MBX explicitly to preserve the MSRV.
      - uses: jdx/mr-boxington-action@v1
        with:
          version: 1.28.0
          cache-generation: msrv-v1
          save-on-pull-request: true
      - name: Check
        run: mbx check --all-targets

  # Link every release target on PRs without paying release LTO costs.
  build:
    name: 🏗️ Build (${{ matrix.build.label }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.build.runner }}
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        build:
          - { label: linux-amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: linux-amd64-musl, target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { label: darwin-amd64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { label: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { label: windows-amd64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.target }}
      # This payload also retains outputs produced inside cross containers.
      - uses: jdx/mr-boxington-action@v1
        if: matrix.build.target != 'x86_64-apple-darwin'
        with:
          version: 1.28.0
          cache-generation: pr-build-${{ matrix.build.target }}-v1
          save-on-pull-request: true
      - uses: taiki-e/install-action@cross
        if: matrix.build.cross
      - name: Statically link the MSVC C runtime
        if: endsWith(matrix.build.target, 'windows-msvc')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build
        env:
          TARGET: ${{ matrix.build.target }}
          CROSS: ${{ matrix.build.cross }}
        run: |
          if [ "${CROSS:-}" = "true" ]; then
            cross build --locked --target "$TARGET"
          elif [ "$TARGET" = x86_64-apple-darwin ]; then
            # MBX does not publish an Intel macOS executable.
            cargo build --locked --target "$TARGET"
          else
            mbx build --locked --target "$TARGET"
          fi

  # `git tpl` only works if the binary is named `git-tpl` and is on PATH. That
  # is not a stylistic choice — it is the mechanism Git uses to resolve
  # subcommands, and getting it wrong breaks the invocation the project is
  # named after, on a user's machine rather than here.
  subcommand:
    name: 🔌 Git subcommand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
        with:
          version: 1.28.0
          cache-generation: subcommand-v1
          save-on-pull-request: true

      - name: Verify `git tpl` resolves to the built binary
        run: |
          mbx build --locked --release
          test -x target/release/git-tpl
          export PATH="$PWD/target/release:$PATH"

          # Proves Git found and executed our binary as a subcommand.
          git tpl --version

          # Built-in help works even without an installed manual page.
          git tpl help > /dev/null
          git tpl help update > /dev/null

          # `git tpl --help` does not reach the binary at all: Git intercepts
          # `--help` for a subcommand and execs `man git-tpl`. That is why the
          # project ships a man page — without one this exits 16 with "No
          # manual entry for git-tpl", which is a broken first impression for
          # the invocation the project is named after.
          git-tpl man --out-dir "$RUNNER_TEMP/man/man1"
          if command -v man > /dev/null; then
            MANPATH="$RUNNER_TEMP/man:" git tpl --help > /dev/null
          else
            # Guarded rather than assumed: a runner image without man-db would
            # fail this for a reason that has nothing to do with the change
            # being tested.
            echo '::notice::man is not installed; skipping the git tpl --help check'
            git-tpl --help > /dev/null
          fi
          # Exercise command dispatch without contacting the attached template.
          # Git's --help interception above is separate from CLI argument parsing.
          git tpl status -h > "$RUNNER_TEMP/tpl-status-help"
          grep -q 'git tpl status' "$RUNNER_TEMP/tpl-status-help"

  action:
    name: 📥 Action installer
    runs-on: ubuntu-latest
    env:
      PINNED_TPL_VERSION: 0.14.3
    steps:
      - uses: actions/checkout@v7
      - uses: ./

      # GITHUB_PATH becomes visible only after the action step has finished.
      - name: Verify the installed Git subcommand
        run: git tpl --version

      - uses: ./
        with:
          version: ${{ env.PINNED_TPL_VERSION }}
      - name: Verify an exact release tag can be installed
        run: test "$(git tpl --version)" = "git-tpl $PINNED_TPL_VERSION"
